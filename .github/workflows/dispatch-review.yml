# Central dispatcher — triggered by GitHub App webhook (CF Worker) or manually.
# Consumer repos need ZERO workflow YAML; install the Sorge GitHub App only.

name: Sorge Dispatch Review

on:
  repository_dispatch:
    types: [sorge-review]
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repo owner/name"
        required: true
        type: string
      pr_number:
        description: "PR number"
        required: true
        type: number
      installation_id:
        description: "GitHub App installation ID"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.2"

jobs:
  review:
    name: Sorge Central Review
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve dispatch inputs
        id: inputs
        run: |
          if [ -n "${{ github.event.client_payload.repo }}" ]; then
            FULL_REPO="${{ github.event.client_payload.repo }}"
            echo "PR_NUMBER=${{ github.event.client_payload.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "INSTALLATION_ID=${{ github.event.client_payload.installation_id }}" >> "$GITHUB_OUTPUT"
            FORCE="${{ github.event.client_payload.force }}"
          else
            FULL_REPO="${{ inputs.repo }}"
            echo "PR_NUMBER=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "INSTALLATION_ID=${{ inputs.installation_id }}" >> "$GITHUB_OUTPUT"
            FORCE=""
          fi

          echo "REPO=${FULL_REPO}" >> "$GITHUB_OUTPUT"
          echo "REPO_OWNER=${FULL_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "REPO_NAME=${FULL_REPO##*/}" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "FORCE_FLAG=--force" >> "$GITHUB_OUTPUT"
          else
            echo "FORCE_FLAG=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SORGE_APP_ID }}
          private-key: ${{ secrets.SORGE_APP_PRIVATE_KEY }}
          owner: ${{ steps.inputs.outputs.REPO_OWNER }}
          repositories: ${{ steps.inputs.outputs.REPO_NAME }}

      - name: Debug token scope
        run: |
          echo "Installation ID passed in: '${{ steps.inputs.outputs.INSTALLATION_ID }}'"
          echo "Installation ID token action reports: '${{ steps.app-token.outputs.installation-id }}'"
          echo "Repo we're posting to: '${{ steps.inputs.outputs.REPO }}'"
          echo "Owner used for token scope: '${{ steps.inputs.outputs.REPO_OWNER }}'"
          echo "Repo name used for token scope: '${{ steps.inputs.outputs.REPO_NAME }}'"

      - name: Post starting message
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl -sS -X POST \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ steps.inputs.outputs.REPO }}/issues/${{ steps.inputs.outputs.PR_NUMBER }}/comments" \
            -d '{"body": "Starting AI review..."}'

      - name: Checkout sorge
        uses: actions/checkout@v4

      - name: Resolve PR head SHA
        id: pr-head
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          HEAD_SHA=$(curl -sS \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ steps.inputs.outputs.REPO }}/pulls/${{ steps.inputs.outputs.PR_NUMBER }}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "PR head SHA: $HEAD_SHA"

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.inputs.outputs.REPO }}
          path: target-repo
          ref: ${{ steps.pr-head.outputs.HEAD_SHA }}
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Restore provider history cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sorge/provider_stats.json
          key: sorge-provider-stats-v1-${{ github.run_id }}
          restore-keys: |
            sorge-provider-stats-v1-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==${{ env.POETRY_VERSION }}"
          poetry install --no-interaction --no-ansi

      - name: Run AI review
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SORGE_APP_ID: ${{ secrets.SORGE_APP_ID }}
          SORGE_APP_PRIVATE_KEY: ${{ secrets.SORGE_APP_PRIVATE_KEY }}
        run: |
          set -o pipefail
          INSTALL_FLAG=""
          if [ -n "${{ steps.inputs.outputs.INSTALLATION_ID }}" ]; then
            INSTALL_FLAG="--installation-id ${{ steps.inputs.outputs.INSTALLATION_ID }}"
          fi

          CONFIG_FLAG=""
          if [ -f target-repo/sorge.toml ]; then
            CONFIG_FLAG="--config target-repo/sorge.toml"
          fi

          poetry run python -m bot.main \
            --repo "${{ steps.inputs.outputs.REPO }}" \
            --pr-number "${{ steps.inputs.outputs.PR_NUMBER }}" \
            --repo-root target-repo \
            $INSTALL_FLAG \
            $CONFIG_FLAG \
            ${{ steps.inputs.outputs.FORCE_FLAG }} \
            --mode auto \
            --verbose | tee review-output.json

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ steps.inputs.outputs.PR_NUMBER }}
          path: review-output.json
          retention-days: 7