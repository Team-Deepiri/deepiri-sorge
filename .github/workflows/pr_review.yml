# Runs Sorge on PRs in this repository (dogfooding).
# Other repos: install the Sorge GitHub App — see docs/GITHUB_APP.md

name: Sorge AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR Number"
        required: true
        type: number
      mode:
        description: "Review mode"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - groq
          - openrouter
          - gemini
          - skip

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: ./.github/workflows/sorge-review.yml
    with:
      bot_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      mode: ${{ inputs.mode || 'auto' }}
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
    secrets: inherit
