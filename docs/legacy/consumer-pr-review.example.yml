# DEPRECATED — use GitHub App install instead (see docs/GITHUB_APP.md)
# Copy to YOUR repo as .github/workflows/pr_review.yml
# Pin to a released tag — do not float @main in production.
#
# Required repository secrets:
#   GOOGLE_API_KEY, OPENROUTER_API_KEY, GROQ_API_KEY
# GITHUB_TOKEN is provided automatically.

name: Sorge AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: Team-Deepiri/deepiri-sorge/.github/workflows/sorge-review.yml@v0.1.0
    with:
      bot_ref: v0.1.0
      mode: auto
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
