# Sorge configuration

[sorge]
enabled = true

[filters]
min_lines = 20
skip_docs = true
skip_deps = true
skip_tests = false
max_cpu_lines = 500

[review]
style = "concise"
include_security = true
include_performance = true
include_style = true

[gpu]
enabled = false

[model]
name = "codellama-7b-q4"

[gemini]
enabled = true
model = "gemini-2.5-flash"

[openrouter]
enabled = true
model = "qwen/qwen3-coder:free"
endpoint = "https://openrouter.ai/api/v1/chat/completions"

[groq]
enabled = true
model = "qwen/qwen3-32b"
endpoint = "https://api.groq.com/openai/v1/chat/completions"

[routing]
small_pr_threshold = 4500
medium_pr_threshold = 30000
large_pr_threshold = 30000

[cache]
enabled = true
ttl_hours = 24