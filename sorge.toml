# Sorge configuration

[sorge]
enabled = true

[filters]
min_lines = 20
skip_docs = true
skip_deps = true
skip_tests = false

[review]
style = "concise"
include_security = true
include_performance = true
include_style = true

[gemini]
enabled = true
model = "gemini-2.5-flash"

[openrouter]
enabled = true
models = [
    "google/gemma-4-31b-it:free",
    "openai/gpt-oss-20b:free",
    "meta-llama/llama-3.3-70b-instruct:free",
    "poolside/laguna-m.1:free",
]
endpoint = "https://openrouter.ai/api/v1/chat/completions"

[groq]
enabled = true
model = "openai/gpt-oss-120b"
endpoint = "https://api.groq.com/openai/v1/chat/completions"

[routing]
small_pr_threshold = 5000
medium_pr_threshold = 120000
large_pr_threshold = 120000
chunk_budget = 100000
# Gemini-dead fallback only — happy path unchanged when Gemini is usable
context_shave_enabled = true
context_shave_max_extracts = 12
context_shave_slice_budget = 3500

[quota]
gemini_rpd = 20
gpt_rpd = 1000
openrouter_rpd = 50
warn_at_pct = 0.8

[cache]
enabled = true
ttl_hours = 24

[repo_context]
enabled = true
max_anchors = 8
max_scan_files = 120
max_files_per_anchor = 3
max_snippets = 5
max_deps = 12
max_chars = 2800

[claim_verifier]
enabled = true
include_symbol_index = true
max_index_chars = 2400

[finding_adjudicator]
enabled = true

[scheduler]
wall_clock_sec = 720
max_workers = 4
health_threshold = 25.0
partial_on_exhausted = true
# Wait for cooldowns / slots, but don't burn the Actions job for 10+ minutes.
max_capacity_wait_sec = 120
auto_retry_delay_min_sec = 60
auto_retry_delay_max_sec = 120
# Free-tier survival: when Gemini RPD is gone, don't stampede 30+ chunks onto Groq/OR.
gemini_dead_max_chunks = 8

[providers.groq]
rpm = 30
max_inflight = 2
# Free-tier window is ~8k including template + repo context; 413 shrinks further at runtime
max_context_tokens = 7000
quality_prior = 0.9
nominal_latency_ms = 400

[providers.openrouter]
rpm = 20
max_inflight = 2
max_context_tokens = 100000
quality_prior = 0.7
nominal_latency_ms = 800

[providers.gemini]
rpm = 10
max_inflight = 1
max_context_tokens = 200000
quality_prior = 0.85
nominal_latency_ms = 1200
