# Sorge configuration

[sorge]
enabled = true

[filters]
min_lines = 20
skip_docs = true
skip_deps = true
skip_tests = false

[review]
style = "concise"
include_security = true
include_performance = true
include_style = true

[gemini]
enabled = true
model = "gemini-2.5-flash"

[openrouter]
enabled = true
model = "google/gemma-4-31b-it:free"
endpoint = "https://openrouter.ai/api/v1/chat/completions"

[groq]
enabled = true
model = "openai/gpt-oss-120b"
endpoint = "https://api.groq.com/openai/v1/chat/completions"

[routing]
small_pr_threshold = 5000
medium_pr_threshold = 200000
large_pr_threshold = 200000
chunk_budget = 180000

[quota]
gemini_rpd = 20
gpt_rpd = 1000
openrouter_rpd = 50
warn_at_pct = 0.8

[cache]
enabled = true
ttl_hours = 24

[repo_context]
enabled = true
max_anchors = 8
max_scan_files = 120
max_files_per_anchor = 3
max_snippets = 5
max_deps = 12
max_chars = 2800