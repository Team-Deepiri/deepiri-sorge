name = "sorge-webhook"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "SORGE_LEDGER"
id = "ec099ecb082d43b89920480c806efe95"

[triggers]
# Hourly escalate drain backup + every-minute due auto-retries
crons = ["20 * * * *", "* * * * *"]

[vars]
# Secrets via wrangler secret put:
#   GITHUB_WEBHOOK_SECRET, SORGE_APP_ID, SORGE_APP_PRIVATE_KEY,
#   SORGE_LEDGER_SECRET, SORGE_DRAIN_INSTALLATION_ID
